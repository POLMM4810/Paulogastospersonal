<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paulo Personal">
<title>Paulo Personal</title>
<style>
/* RESET */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}

/* TOKENS — graphite + electric blue + gold accent */
:root{
  /* Surfaces */
  --s0: #07080D;   /* deepest background */
  --s1: #0D0F18;   /* card background */
  --s2: #131624;   /* elevated card */
  --s3: #1A1F30;   /* input / subtle */
  --s4: #222840;   /* hover state */
  /* Borders */
  --b1: #1E2438;
  --b2: #28304A;
  /* Brand */
  --blue:  #4F8EF7;
  --blue2: rgba(79,142,247,.12);
  --blue3: rgba(79,142,247,.06);
  --gold:  #D4A830;
  --gold2: rgba(212,168,48,.12);
  /* Semantic */
  --green: #34D399;
  --green2:rgba(52,211,153,.1);
  --red:   #F87171;
  --red2:  rgba(248,113,113,.1);
  --amber: #FBBF24;
  /* Text */
  --t1: #F8FAFC;   /* primary */
  --t2: #94A3B8;   /* secondary */
  --t3: #475569;   /* muted */
  /* Typography */
  --f: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  --fm: 'SF Mono',ui-monospace,'Courier New',monospace;
}

body{background:var(--s0);font-family:var(--f);color:var(--t1);text-transform:uppercase;letter-spacing:.3px;}

input,select,button,textarea{font-family:var(--f);text-transform:none!important;letter-spacing:normal;}
input::placeholder{color:var(--t3);font-size:14px;}
select option{background:var(--s2);}
::-webkit-scrollbar{width:0;height:0;}

/* ANIMATIONS — one orchestrated entrance only */
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes ring{0%,100%{opacity:.05}50%{opacity:.15}}
@keyframes barGrow{from{width:0}to{width:var(--w)}}

/* ── PIN ─────────────────────────────────────────────────────────────────── */
#pin{
  position:fixed;inset:0;z-index:999;
  background:radial-gradient(ellipse 120% 80% at 50% 20%, #0D1428 0%, var(--s0) 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring{position:absolute;border-radius:50%;border:1px solid var(--gold);
  top:50%;left:50%;transform:translate(-50%,-50%);animation:ring 4s ease-in-out infinite;}
.pin-brand{animation:fadeIn .7s ease both;text-align:center;position:relative;z-index:1;}
.pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:32px;}
.pin-dot{
  width:12px;height:12px;border-radius:50%;
  background:transparent;border:2px solid var(--b2);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
.pin-dot.on{background:var(--blue);border-color:var(--blue);transform:scale(1.2);box-shadow:0 0 14px var(--blue2);}
.pin-dot.err{background:var(--red);border-color:var(--red);}
#pin-field:focus{outline:none;}
#pin-err{color:var(--red);font-size:11px;margin-top:12px;min-height:16px;font-family:var(--fm);letter-spacing:1px;}
.faceid-btn{
  margin-top:28px;background:none;border:1px solid var(--b2);border-radius:12px;
  padding:10px 22px;color:var(--t3);font-size:12px;cursor:pointer;
  display:none;align-items:center;gap:8px;transition:all .2s;letter-spacing:.5px;
}
.faceid-btn.available{border-color:var(--gold);color:var(--gold);}

/* ── APP SHELL ───────────────────────────────────────────────────────────── */
#app{display:none;flex-direction:column;min-height:100vh;}
#app.on{display:flex;animation:fadeIn .5s ease both;}

/* ── HEADER ──────────────────────────────────────────────────────────────── */
#hdr{
  background:rgba(7,8,13,.92);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--b1);
  padding:14px 18px 12px;
  position:sticky;top:0;z-index:100;
}
.hdr-top{display:flex;align-items:center;justify-content:space-between;}
.hdr-logo{display:flex;align-items:center;gap:12px;}
.hdr-sub{color:var(--blue);font-size:9px;letter-spacing:4px;font-family:var(--fm);opacity:.9;}
.hdr-total{color:var(--t1);font-size:24px;font-weight:700;line-height:1;letter-spacing:-.5px;}
.hdr-right{text-align:right;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 3s infinite;flex-shrink:0;}
.sspin{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--gold);border-top-color:transparent;animation:spin .7s linear infinite;flex-shrink:0;}
#sync-txt{font-size:9px;color:var(--t3);margin-top:2px;font-family:var(--fm);}

/* Month selector */
#mbar{
  margin-top:12px;display:flex;align-items:center;justify-content:space-between;
  background:var(--s2);border:1px solid var(--b1);border-radius:12px;
  padding:9px 14px;cursor:pointer;font-size:12px;color:var(--t1);
  letter-spacing:1px;font-weight:600;transition:background .15s;
}
#mbar:active{background:var(--s3);}
#mdrop{
  display:none;margin-top:6px;background:var(--s1);
  border-radius:14px;border:1px solid var(--b1);overflow:hidden;
  box-shadow:0 24px 48px rgba(0,0,0,.6);
}
#mdrop.on{display:block;}
.mrow{
  padding:13px 18px;border-bottom:1px solid var(--b1);
  cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  font-size:13px;color:var(--t2);transition:background .1s;font-weight:500;
}
.mrow:active{background:var(--s2);}
.mrow.cur{background:var(--s3);color:var(--t1);font-weight:700;}
#nm-form{padding:12px 16px;border-top:1px solid var(--b1);display:none;gap:8px;flex-wrap:wrap;align-items:center;}
#nm-form.on{display:flex;}

/* ── BOTTOM NAV ──────────────────────────────────────────────────────────── */
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(7,8,13,.96);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:1px solid var(--b1);
  display:flex;z-index:200;
  padding-bottom:env(safe-area-inset-bottom);
}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 2px 8px;border:none;background:none;cursor:pointer;gap:4px;
}
.bnav-icon{font-size:20px;line-height:1;transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.bnav-label{font-size:9px;color:var(--t3);letter-spacing:.5px;font-family:var(--fm);transition:color .15s;}
.bnav-btn.on .bnav-label{color:var(--blue);}
.bnav-btn.on .bnav-icon{transform:scale(1.15);}
.bnav-btn:active .bnav-icon{transform:scale(.9);}

/* ── CONTENT ─────────────────────────────────────────────────────────────── */
#content{padding:16px 16px 96px;flex:1;}

/* ── CARDS ───────────────────────────────────────────────────────────────── */
.card{
  background:var(--s1);border-radius:18px;
  border:1px solid var(--b1);margin-bottom:12px;overflow:hidden;
}
.card-hdr{
  padding:14px 18px;border-bottom:1px solid var(--b1);
  display:flex;justify-content:space-between;align-items:center;
}
.lbl{font-size:9px;letter-spacing:2.5px;font-family:var(--fm);color:var(--t3);}

/* ── CATEGORY ROWS ───────────────────────────────────────────────────────── */
.cat-row{
  display:flex;align-items:center;padding:14px 18px;
  border-bottom:1px solid var(--b1);cursor:pointer;transition:background .12s;
}
.cat-row:last-child{border-bottom:none;}
.cat-row:active{background:var(--s3);}
.cat-emoji{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
.cat-label{font-size:13px;color:var(--t2);flex:1;margin-left:12px;font-weight:500;letter-spacing:.2px;}
.cat-amount{font-size:16px;font-weight:700;color:var(--t1);letter-spacing:-.3px;}

/* ── EXPENSE ROWS ────────────────────────────────────────────────────────── */
.xrow{border-bottom:1px solid var(--b1);transition:background .1s;}
.xrow:active{background:var(--s3);}
.xin{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;}
.xleft{display:flex;flex-direction:column;gap:3px;flex:1;}
.xright{display:flex;align-items:center;gap:12px;}
.ibt{background:none;border:none;cursor:pointer;font-size:16px;opacity:.35;padding:2px;transition:opacity .15s;}
.ibt:active{opacity:1;}
.expense-name{font-size:14px;color:var(--t1);font-weight:500;}
.expense-note{font-size:11px;color:var(--t3);letter-spacing:.2px;}
.expense-amt{font-size:15px;font-weight:700;letter-spacing:-.2px;}

/* ── FORMS ───────────────────────────────────────────────────────────────── */
.erow{display:flex;gap:6px;padding:12px 16px;flex-wrap:wrap;align-items:center;background:var(--s2);}
.ei{
  border:1px solid var(--b2);border-radius:10px;padding:9px 13px;
  font-size:14px;background:var(--s3);color:var(--t1);outline:none;
  transition:border-color .15s;
}
.ei:focus{border-color:var(--blue);}
.ei.w{flex:2;min-width:90px;}
.ei.n{width:80px;}
.arow{
  display:flex;gap:6px;padding:12px 16px;background:var(--s0);
  flex-wrap:wrap;border-top:1px solid var(--b1);
}
.ai{
  border:1px solid var(--b1);border-radius:10px;padding:10px 13px;
  font-size:14px;background:var(--s2);color:var(--t1);outline:none;transition:border-color .15s;
}
.ai:focus{border-color:var(--blue);}
.ai.w{flex:2;min-width:90px;}
.ai.n{width:74px;}
.subs{
  display:flex;justify-content:flex-end;padding:10px 18px;
  background:var(--s0);border-top:1px solid var(--b1);
  font-size:12px;color:var(--t2);font-weight:600;
}
.empty{padding:36px;text-align:center;color:var(--t3);font-size:12px;letter-spacing:.5px;}
.inline-in{
  border:1px solid var(--b2);border-radius:8px;padding:7px 10px;
  font-size:14px;background:var(--s2);color:var(--t1);
  width:90px;text-align:right;outline:none;
}

/* ── CHECKLIST ───────────────────────────────────────────────────────────── */
.chk-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px;border-bottom:1px solid var(--b1);cursor:pointer;
  transition:background .1s;
}
.chk-row:active{background:var(--s3);}
.chk-box{
  width:22px;height:22px;border-radius:7px;border:2px solid var(--b2);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;transition:all .2s;color:var(--green);
}
.chk-box.done{background:var(--green2);border-color:var(--green);}

/* ── UNDO PANEL ──────────────────────────────────────────────────────────── */
#undo-panel{
  position:fixed;bottom:80px;left:14px;right:14px;
  background:var(--s2);border:1px solid var(--b2);border-radius:16px;
  padding:14px 16px;z-index:999;opacity:0;transition:opacity .2s;
  pointer-events:none;box-shadow:0 -8px 40px rgba(0,0,0,.7);
}
#undo-panel.show{opacity:1;pointer-events:auto;}

/* ── MIC BUTTON ──────────────────────────────────────────────────────────── */
#mic-btn{
  position:fixed;bottom:80px;right:18px;
  width:48px;height:48px;border-radius:50%;
  background:var(--blue);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  z-index:201;box-shadow:0 4px 24px rgba(79,142,247,.4);
  transition:transform .15s,box-shadow .15s;
}
#mic-btn:active{transform:scale(.9);box-shadow:0 2px 12px rgba(79,142,247,.3);}

/* ── VOICE MODAL ─────────────────────────────────────────────────────────── */
#voice-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#voice-modal.show{display:flex;}
#voice-card{
  background:var(--s1);border-radius:24px 24px 0 0;width:100%;
  padding:22px 18px;padding-bottom:calc(22px + env(safe-area-inset-bottom));
  border-top:1px solid var(--b2);box-shadow:0 -24px 60px rgba(0,0,0,.6);
}
.voice-hint{
  background:var(--s3);border-radius:12px;padding:12px 14px;
  font-size:12px;color:var(--t3);margin-bottom:14px;line-height:1.6;
  border:1px solid var(--b1);
}
.voice-hint span{color:var(--blue);}
#voice-input{
  width:100%;background:var(--s2);border:1.5px solid var(--blue);
  border-radius:12px;padding:14px;font-size:16px;color:var(--t1);
  resize:none;height:52px;outline:none;box-sizing:border-box;margin-bottom:12px;
}
.voice-result{
  background:var(--green2);border-radius:12px;padding:14px;
  margin-bottom:14px;border:1px solid rgba(52,211,153,.2);display:none;
}
.voice-result.show{display:block;}
.voice-field{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--b1);
}
.voice-field:last-child{border-bottom:none;}
.voice-label{font-size:9px;color:var(--t3);letter-spacing:2px;font-family:var(--fm);}
.voice-value{font-size:14px;color:var(--t1);font-weight:600;}
.voice-actions{display:flex;gap:8px;}
.voice-actions button{
  flex:1;padding:13px;border:none;border-radius:12px;
  font-family:var(--f);font-size:14px;cursor:pointer;font-weight:600;
  transition:opacity .15s;
}
.voice-actions button:active{opacity:.8;}

/* GLOBAL INPUTS override */
input[type=number],input[type=text],input[type=password],input[type=tel],select{
  color:var(--t1)!important;background:var(--s2)!important;
  border:1px solid var(--b2)!important;border-radius:10px;
}
select option{background:var(--s2)!important;color:var(--t1)!important;}
</style>
</head>
<body>

<!-- PIN -->
<div id="pin">
  <div class="ring" style="width:240px;height:240px;animation-delay:0s;"></div>
  <div class="ring" style="width:400px;height:400px;animation-delay:.7s;animation-duration:3.5s;"></div>
  <div class="ring" style="width:560px;height:560px;animation-delay:1.4s;animation-duration:5s;"></div>
  <div class="pin-brand">
    <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
      <defs>
        <linearGradient id="pbg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#0D1022"/>
          <stop offset="100%" stop-color="#07080D"/>
        </linearGradient>
        <radialGradient id="pglow" cx="48" cy="20" r="60" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#4F8EF7" stop-opacity=".25"/>
          <stop offset="100%" stop-color="#4F8EF7" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="96" height="96" fill="url(#pbg)"/>
      <rect width="96" height="96" fill="url(#pglow)"/>
      <!-- Gold border -->
      <rect x="2" y="2" width="92" height="92" fill="none" stroke="#D4A830" stroke-width="1.5"/>
      <!-- Corner accents -->
      <path d="M2 14 L2 2 L14 2" fill="none" stroke="#D4A830" stroke-width="2"/>
      <path d="M82 2 L94 2 L94 14" fill="none" stroke="#D4A830" stroke-width="2"/>
      <path d="M2 82 L2 94 L14 94" fill="none" stroke="#D4A830" stroke-width="2"/>
      <path d="M94 82 L94 94 L82 94" fill="none" stroke="#D4A830" stroke-width="2"/>
      <!-- P monogram -->
      <text x="48" y="66" text-anchor="middle" font-family="-apple-system,'SF Pro Display',sans-serif" font-size="58" font-weight="700" fill="#F8FAFC">P</text>
      <!-- Blue dot -->
      <circle cx="76" cy="20" r="6" fill="#4F8EF7"/>
      <!-- Gold underline -->
      <rect x="30" y="76" width="36" height="1.5" fill="#D4A830"/>
    </svg>
    <div style="color:var(--blue);font-size:9px;letter-spacing:5px;margin-top:18px;font-family:var(--fm);">GASTOS PERSONALES</div>
    <div style="color:var(--t1);font-size:32px;letter-spacing:1px;font-weight:700;margin-top:8px;font-family:var(--f);">PAULO</div>
    <div style="color:var(--t3);font-size:10px;margin-top:8px;letter-spacing:1.5px;font-family:var(--fm);">Control financiero personal</div>
  </div>
  <div id="pin-wrap" style="margin-top:44px;display:flex;flex-direction:column;align-items:center;">
    <div class="pin-dots">
      <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
    </div>
    <input id="pin-field" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="    " style="font-size:32px;letter-spacing:16px;width:180px;text-align:center;background:#0E0E22;color:#C17D3C;border:1.5px solid #2A2A40;border-radius:14px;padding:14px 20px;caret-color:#C17D3C;outline:none;">
    <div id="pin-err"></div>
    <button id="faceid-btn" class="faceid-btn" onclick="useBiometric()" style="display:none;opacity:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="M9 9a4 4 0 0 1 6 0M9 15a4 4 0 0 0 6 0"/></svg>
      Face ID / Touch ID
    </button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="hdr">
    <div class="hdr-top">
      <div class="hdr-logo">
        <svg width="38" height="38" viewBox="0 0 96 96" fill="none">
          <rect width="96" height="96" fill="#0D1022"/>
          <rect x="2" y="2" width="92" height="92" fill="none" stroke="#D4A830" stroke-width="1.5"/>
          <path d="M2 14L2 2L14 2" fill="none" stroke="#D4A830" stroke-width="2"/>
          <path d="M82 2L94 2L94 14" fill="none" stroke="#D4A830" stroke-width="2"/>
          <text x="48" y="66" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="58" font-weight="700" fill="#F8FAFC">P</text>
          <circle cx="76" cy="20" r="6" fill="#4F8EF7"/>
        </svg>
        <div>
          <div class="hdr-sub" style="color:var(--gold);">GASTOS PERSONALES</div>
          <div class="hdr-total" id="ht">0,00 €</div>
        </div>
      </div>
      <div class="hdr-right">
        <div style="font-size:11px;color:#888;margin-bottom:3px;">Total desembolsado</div>
        <div class="hdr-bal">
          <div class="sdot" id="si"></div>
        </div>
        <div id="sync-txt"></div>
      </div>
    </div>
    <div id="mbar" onclick="toggleMDrop()">
      <span>📅 <span id="mlbl">—</span></span>
      <span id="marrow" style="font-size:11px;color:#444;">▼</span>
    </div>
    <div id="mdrop">
      <div id="mlist"></div>
      <div style="padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;" onclick="showNMForm()">
        <span style="color:var(--gold);font-size:16px;">＋</span>
        <span style="font-size:13px;color:var(--gold);">Nuevo mes</span>
      </div>
      <div id="nm-form">
        <select id="nm-m" class="ai" style="flex:2;min-width:100px;"></select>
        <input id="nm-y" class="ai n" placeholder="Año" style="width:72px;">
        <button onclick="createMonth()" style="background:var(--gold);color:#fff;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px;">Crear</button>
        <button onclick="hideNMForm()" style="background:#222;color:#888;border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;">✕</button>
      </div>
    </div>
  </div>
  <div id="tabs" style="display:none;"></div>
  <div id="content"></div>
  <nav id="bottom-nav"></nav>
  <button id="mic-btn" onclick="startVoice()" title="Añadir gasto por voz">🎤</button>
</div>

<!-- Voice Modal -->
<div id="voice-modal">
  <div id="voice-card">
    <div class="voice-status">🎤 AÑADIR GASTO POR VOZ</div>
    <div class="voice-hint">
      Pulsa el campo, luego el 🎤 del teclado y di el gasto.<br>
      Ej: <span>"cervezas bar Vidal 12 euros"</span> o <span>"gasolina 60 euros"</span>
    </div>
    <input id="voice-input" type="text" placeholder="Pulsa aquí y usa el 🎤 del teclado..." autocomplete="off" autocorrect="off" oninput="onVoiceInput(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();processVoiceText(this.value);}">
    <div class="voice-result" id="voice-result">
      <div class="voice-field">
        <span class="voice-label">CATEGORÍA</span>
        <span class="voice-value" id="vr-cat">—</span>

// ─── BIOMETRIC (Face ID / Touch ID) ──────────────────────────────────────────
var CRED_LS = "pp_biometric_id";

function initBiometric(){
  var btn = document.getElementById("faceid-btn");
  if(!btn) return;
  if(!window.PublicKeyCredential){
    btn.style.display = "none";
    return;
  }
  PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
    .then(function(available){
      if(available){
        btn.style.display = "flex";
        btn.style.opacity = "1";
      } else {
        btn.style.display = "none";
      }
    })
    .catch(function(){ btn.style.display = "none"; });
}

function useBiometric(){
  var btn = document.getElementById("faceid-btn");
  var storedId = null;
  try { storedId = localStorage.getItem(CRED_LS); } catch(e){}

  if(storedId){
    // Authenticate with existing credential
    var idBytes;
    try {
      idBytes = Uint8Array.from(atob(storedId), function(c){ return c.charCodeAt(0); });
    } catch(e) {
      // Bad stored data, re-register
      localStorage.removeItem(CRED_LS);
      useBiometric();
      return;
    }
    var challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    navigator.credentials.get({
      publicKey: {
        challenge: challenge,
        rpId: location.hostname,
        allowCredentials: [{ type: "public-key", id: idBytes, transports: ["internal"] }],
        userVerification: "required",
        timeout: 60000
      }
    }).then(function(cred){
      if(cred){ unlock(); }
    }).catch(function(err){
      // If credential not found, re-register
      if(err.name === "NotAllowedError" || err.name === "InvalidStateError"){
        localStorage.removeItem(CRED_LS);
        registerBiometric();
      }
    });
  } else {
    registerBiometric();
  }
}

function registerBiometric(){
  var challenge = new Uint8Array(32);
  crypto.getRandomValues(challenge);
  var userId = new Uint8Array(8);
  crypto.getRandomValues(userId);

  navigator.credentials.create({
    publicKey: {
      challenge: challenge,
      rp: { name: "Gastos App", id: location.hostname },
      user: { id: userId, name: "usuario", displayName: "Usuario" },
      pubKeyCredParams: [
        { alg: -7,   type: "public-key" },
        { alg: -257, type: "public-key" }
      ],
      authenticatorSelection: {
        authenticatorAttachment: "platform",
        userVerification: "required",
        residentKey: "discouraged"
      },
      timeout: 60000,
      attestation: "none"
    }
  }).then(function(cred){
    var idB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(cred.rawId)));
    try { localStorage.setItem(CRED_LS, idB64); } catch(e){}
    unlock();
  }).catch(function(err){
    // Show error briefly on the button
    var btn = document.getElementById("faceid-btn");
    if(btn){
      var orig = btn.innerHTML;
      btn.innerHTML = "⚠️ No disponible en este dispositivo";
      btn.style.color = "#F0A0A0";
      setTimeout(function(){ btn.innerHTML = orig; btn.style.color = ""; }, 3000);
    }
  });
}

// ─── UNDO (historial del día) ─────────────────────────────────────────────
var undoHistory = [];  // array de {data, label, ts}
var undoTimer = null;

function pushUndo(snapshot, label){
  // Guardar copia del mes actual antes del borrado
  undoHistory.push({
    data: JSON.parse(JSON.stringify(snapshot)),
    label: label,
    ts: Date.now()
  });
  // Limpiar entradas de más de 24h
  var cutoff = Date.now() - 86400000;
  undoHistory = undoHistory.filter(function(u){return u.ts > cutoff;});
  showUndoPanel();
}

function showUndoPanel(){
  if(undoTimer)clearTimeout(undoTimer);
  var panel = document.getElementById("undo-panel");
  if(!panel){
    panel = document.createElement("div");
    panel.id = "undo-panel";
    document.body.appendChild(panel);
  }
  renderUndoPanel(panel);
  panel.classList.add("show");
  undoTimer = setTimeout(function(){
    panel.classList.remove("show");
  }, 6000);
}

function renderUndoPanel(panel){
  if(!panel)return;
  var items = undoHistory.slice().reverse().slice(0,5); // últimos 5
  var html = '<div style="font-size:9px;color:#555;letter-spacing:2px;font-family:monospace;margin-bottom:8px;">BORRADOS HOY</div>';
  items.forEach(function(u, i){
    var ago = Math.round((Date.now()-u.ts)/1000);
    var agoStr = ago < 60 ? "ahora" : Math.round(ago/60)+"min";
    html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1A1A2E;">'
      +'<span style="font-size:11px;color:#AAA;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+u.label+'</span>'
      +'<span style="font-size:10px;color:#444;margin:0 8px;">'+agoStr+'</span>'
      +'<button onclick="doUndo('+( undoHistory.length-1-i)+')" style="background:var(--gold);border:none;border-radius:6px;padding:4px 10px;color:#fff;font-family:Georgia,serif;font-size:11px;cursor:pointer;flex-shrink:0;">↩</button>'
      +'</div>';
  });
  html += '<button onclick="document.getElementById(\'undo-panel\').classList.remove(\'show\')" style="margin-top:8px;width:100%;background:none;border:none;color:#444;font-size:11px;cursor:pointer;font-family:Georgia,serif;">CERRAR</button>';
  panel.innerHTML = html;
}

function doUndo(idx){
  if(idx < 0 || idx >= undoHistory.length)return;
  if(undoTimer)clearTimeout(undoTimer);
  S.months[S.curKey] = undoHistory[idx].data;
  undoHistory.splice(idx, 1); // remove recovered item
  var panel = document.getElementById("undo-panel");
  if(undoHistory.length === 0){
    if(panel)panel.classList.remove("show");
  } else {
    renderUndoPanel(panel);
  }
  saveLocal(); renderAll(); fbWrite();
}


// ─── PIN SESSION (recordar PIN 7 días) ───────────────────────────────────────
var PIN_SESSION_KEY = "pp_session";
var PIN_SESSION_DAYS = 7;

function checkPinSession(){
  try {
    var raw = localStorage.getItem(PIN_SESSION_KEY);
    if(!raw) return false;
    var data = JSON.parse(raw);
    if(!data.ts) return false;
    var elapsed = Date.now() - data.ts;
    var days = elapsed / (1000 * 60 * 60 * 24);
    if(days < PIN_SESSION_DAYS){
      return true; // sesión válida
    } else {
      localStorage.removeItem(PIN_SESSION_KEY);
      return false;
    }
  } catch(e){ return false; }
}

function savePinSession(){
  try { localStorage.setItem(PIN_SESSION_KEY, JSON.stringify({ts: Date.now()})); } catch(e){}
}

// ─── PIN ───────────────────────────────────────────────────────────────────
(function(){
  // Check if valid session exists — skip PIN
  if(checkPinSession()){
    document.getElementById("pin").style.display="none";
    loadLocal();
    if(!Object.keys(S.months).length){
      var k=nowKey();S.months[k]=seedMonth();saveLocal();
    }
    launch();
    return;
  }
  var field=document.getElementById("pin-field");
  setTimeout(function(){field.focus();},300);
  field.addEventListener("input",function(){
    var v=this.value.replace(/\D/g,"").slice(0,4);
    this.value=v;
    for(var i=0;i<4;i++){
      var d=document.getElementById("pd"+i);
      d.className="pin-dot"+(v.length>i?" on":"");
    }
    if(v.length===4){
      var self=this;
      setTimeout(function(){
        if(v===PIN_CODE){unlock();}
        else{
          for(var i=0;i<4;i++)document.getElementById("pd"+i).className="pin-dot err";
          document.getElementById("pin-err").textContent="PIN incorrecto";
          document.getElementById("pin-wrap").style.animation="shake .6s";
          setTimeout(function(){
            document.getElementById("pin-wrap").style.animation="";
            document.getElementById("pin-err").textContent="";
            self.value="";
            for(var i=0;i<4;i++)document.getElementById("pd"+i).className="pin-dot";
            self.focus();
          },700);
        }
      },150);
    }
  });
  document.getElementById("pin").addEventListener("click",function(e){
    if(e.target!==field)field.focus();
  });
  initBiometric();
})();

function unlock(){
  savePinSession();
  document.getElementById("pin").style.display="none";
  loadLocal();
  if(!Object.keys(S.months).length){
    var k=nowKey();
    S.months[k]=seedMonth();
    saveLocal();
  }
  launch();
}

function launch(){
  var k=nowKey();
  // Use current month if exists, else most recent, else current
  if(S.months[k]){
    S.curKey=k;
  } else {
    var keys=Object.keys(S.months).sort().reverse();
    S.curKey=keys.length?keys[0]:k;
  }
  // Only seed if truly no months at all
  if(!S.months[S.curKey]){
    S.months[S.curKey]=emptyMonth();
  }
  document.getElementById("app").className="on";
  renderAll();
  startPoll();
}

// ─── DATA ──────────────────────────────────────────────────────────────────
function cur(){
  var d = S.months[S.curKey];
  if(!d) d = emptyMonth();
  // Ensure all required fields exist (defensive for old/corrupted months)
  if(!d.gastos) d.gastos = {};
  CATS_BASE.forEach(function(c){ if(!d.gastos[c.id]) d.gastos[c.id] = []; });
  (S.customCats||[]).forEach(function(c){ if(!d.gastos[c.id]) d.gastos[c.id] = []; });
  if(!d.gasolina) d.gasolina = [];
  if(!d.apuestas) d.apuestas = {balance_mes:0, acum_anio:0, lineas:[]};
  if(!d.apuestas.lineas) d.apuestas.lineas = [];
  if(!d.bankinter) d.bankinter = BANKINTER_BASE.map(function(b){return Object.assign({},b,{pagado:false});});
  if(!d.sabadell) d.sabadell = SABADELL_BASE.map(function(b){return Object.assign({},b,{pagado:false});});
  if(!d.notas) d.notas = [];
  if(!d.meta) d.meta = {presupuesto:1500, bote:0};
  if(!d.alertas) d.alertas = {};
  S.months[S.curKey] = d;
  return d;
}
function saveData(d){S.months[S.curKey]=d;saveLocal();renderAll();fbWrite();}

function totals(){
  var t=0;
  var g=cur().gastos;
  Object.keys(g).forEach(function(k){g[k].forEach(function(x){t+=x.importe;});});
  var gas=cur().gasolina||[];gas.forEach(function(x){t+=x.euros||0;});
  return {total:t};
}
function catTot(id){
  var cat=(cur().gastos[id]||[]);
  var t=cat.reduce(function(s,x){return s+x.importe;},0);
  return {total:t};
}
function bankTot(which){
  var items=cur()[which]||[];
  var total=items.reduce(function(s,x){return s+x.importe;},0);
  var paid=items.filter(function(x){return x.pagado;}).reduce(function(s,x){return s+x.importe;},0);
  return {total:total,paid:paid,pending:total-paid};
}
function gasTot(){
  var gas=cur().gasolina||[];
  return gas.reduce(function(s,x){return s+(x.euros||0);},0);
}

  else if(masTabs.indexOf(S.tab) >= 0) activeGroup = "mas";
  else if(S.tab === "resumen") activeGroup = "resumen";

  var nav = document.getElementById("bottom-nav");
  if(!nav) return;
  nav.innerHTML = groups.map(function(g){
    var on = activeGroup === g.id;
    return '<button class="bnav-btn'+(on?' on':'')+'" onclick="navClick(\''+g.id+'\')">' 
      +'<span class="bnav-icon">'+g.emoji+'</span>'
      +'<span class="bnav-label">'+(on?'<span style="color:#C17D3C;">'+g.label.toUpperCase()+'</span>':g.label.toUpperCase())+'</span>'
      +'</button>';
  }).join("");
}

        +'</div>';

  return h;

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function startEdit(id,sec,enc){
  S.editId=id;S.editSec=sec;
  try{S.editRow=JSON.parse(decodeURIComponent(enc));}catch(e){S.editRow={};}
  renderContent();
}
function cancelEdit(){S.editId=null;renderContent();}
function saveEdit(catId,id){
  var imp=parseFloat(String(S.editRow.importe).replace(",","."));
  if(isNaN(imp))return;
  var d=cur();
  d.gastos[catId]=d.gastos[catId].map(function(g){
    return g.id===id?Object.assign({},g,{concepto:S.editRow.concepto,importe:imp,nota:S.editRow.nota||""}):g;
  });
  S.editId=null;saveData(d);
}
function delGasto(catId,id){
  var d=cur();var deleted=d.gastos[catId].find(function(g){return g.id===id;});
  pushUndo(d,"Gasto borrado: "+(deleted?deleted.concepto:""));
  d.gastos[catId]=d.gastos[catId].filter(function(g){return g.id!==id;});saveData(d);
}
function addGasto(catId){
  var imp=parseFloat(String(S.newRow.importe).replace(",","."));
  if(!S.newRow.concepto||isNaN(imp)||imp<0)return;
  var d=cur();
  if(!d.gastos[catId])d.gastos[catId]=[];
  d.gastos[catId].push({id:uid(),concepto:S.newRow.concepto,importe:imp,nota:S.newRow.nota||""});
  S.newRow={concepto:"",importe:""};saveData(d);
}

var chartInstances={};
function destroyChart(id){} // no-op, canvas is replaced by innerHTML

function renderGraficas(){
  var keys=Object.keys(S.months).sort();
  if(keys.length===0) return '<div class="card"><div style="padding:30px;text-align:center;color:#444;font-size:13px;">SIN DATOS AÚN.<br><br>AÑADE GASTOS DE VARIOS MESES<br>PARA VER LA EVOLUCIÓN.</div></div>';

  var labels=keys.map(function(k){var p=k.split("-");return MESES[parseInt(p[1])-1].slice(0,3).toUpperCase()+" "+p[0].slice(2);});
  var allCats=cats();

  // ═══ CHART 1: Stacked bars evolution ═══
  var W=340,H=200,PL=48,PR=16,PT=16,PB=40;
  var CW=W-PL-PR, CH=H-PT-PB;
  var monthTotals=keys.map(function(k){
    return allCats.reduce(function(s,cat){return s+(S.months[k].gastos[cat.id]||[]).reduce(function(s2,x){return s2+x.importe;},0);},0);
  });
  var maxVal=Math.max.apply(null,monthTotals.concat([1]));
  var bw=keys.length>0?Math.min(40,CW/keys.length*0.6):20;
  var bSpace=keys.length>0?CW/keys.length:CW;

  // Grid lines
  var grid='';
  for(var gi=0;gi<=4;gi++){
    var gy=PT+gi*(CH/4);
    var gv=Math.round(maxVal*(1-gi/4));
    grid+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="#1C1C30" stroke-width="1"/>';
    grid+='<text x="'+(PL-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="9" fill="#555" font-family="monospace">'+gv+'</text>';
  }

  // Stacked bars
  var bars='';
  keys.forEach(function(k,i){
    var bx=PL+i*bSpace+(bSpace-bw)/2;
    var yOff=0;
    allCats.forEach(function(cat){
      var v=(S.months[k].gastos[cat.id]||[]).reduce(function(s,x){return s+x.importe;},0);
      if(v<=0)return;
      var bh=(v/maxVal)*CH;
      var by=PT+CH-yOff-bh;
      bars+='<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" fill="'+cat.color+'" rx="1"/>';
      yOff+=bh;
    });
    // Total on top
    if(monthTotals[i]>0){
      var topY=PT+CH-(monthTotals[i]/maxVal)*CH-4;
      bars+='<text x="'+(bx+bw/2)+'" y="'+topY+'" text-anchor="middle" font-size="8" fill="#AAA" font-family="monospace">'+Math.round(monthTotals[i])+'</text>';
    }
    // X label
    bars+='<text x="'+(bx+bw/2)+'" y="'+(H-PB+14)+'" text-anchor="middle" font-size="9" fill="#666" font-family="monospace">'+labels[i]+'</text>';
  });

  // Legend - 2 per row
  var legItems=allCats.map(function(cat,i){
    var lx=PL+(i%3)*(CW/3), ly=H+8+Math.floor(i/3)*14;
    return '<rect x="'+lx+'" y="'+(ly)+'" width="8" height="8" fill="'+cat.color+'" rx="1"/>'
      +'<text x="'+(lx+10)+'" y="'+(ly+7)+'" font-size="8" fill="#888" font-family="monospace">'+cat.label.toUpperCase()+'</text>';
  }).join('');
  var legH=Math.ceil(allCats.length/3)*14+10;

  var svgEvol='<svg viewBox="0 0 '+W+' '+(H+legH)+'" style="width:100%;display:block;">'
    +'<rect width="'+W+'" height="'+(H+legH)+'" fill="#040410" rx="10"/>'
    +grid+bars+legItems+'</svg>';

  // ═══ CHART 2: Apuestas evolution (saldo mensual + acumulado) ═══
  var BW=340,BH=180,BPL=48,BPR=16,BPT=16,BPB=40;
  var BCW=BW-BPL-BPR, BCH=BH-BPT-BPB;
  var apData=keys.map(function(k){return (S.months[k].apuestas&&S.months[k].apuestas.balance_mes)||0;});
  var maxAbs=Math.max.apply(null,apData.map(Math.abs).concat([1]));
  var bw2=keys.length>0?Math.min(28,BCW/keys.length*0.5):20;
  var bsp2=keys.length>0?BCW/keys.length:BCW;
  var midY=BPT+BCH/2;
  var bscale=(BCH/2)/maxAbs;

  var bgrid='<line x1="'+BPL+'" y1="'+midY+'" x2="'+(BW-BPR)+'" y2="'+midY+'" stroke="#2A2A40" stroke-width="1"/>';
  bgrid+='<text x="'+(BPL-6)+'" y="'+(midY+3)+'" text-anchor="end" font-size="9" fill="#555" font-family="monospace">0</text>';

  var bbars='';
  keys.forEach(function(k,i){
    var cx=BPL+i*bsp2+bsp2/2;
    var v=apData[i];
    var bh=Math.abs(v)*bscale;
    var by=v>=0?midY-bh:midY;
    var color=v>=0?"#3A9A3A":"#B85450";
    bbars+='<rect x="'+(cx-bw2/2)+'" y="'+by+'" width="'+bw2+'" height="'+bh+'" fill="'+color+'" rx="2"/>';
    bbars+='<text x="'+cx+'" y="'+(BH-BPB+14)+'" text-anchor="middle" font-size="9" fill="#666" font-family="monospace">'+labels[i]+'</text>';
  });
  var svgPvM='<svg viewBox="0 0 '+BW+' '+(BH+20)+'" style="width:100%;display:block;">'
    +'<rect width="'+BW+'" height="'+(BH+20)+'" fill="#040410" rx="10"/>'
    +bgrid+bbars
    +'<rect x="'+BPL+'" y="'+(BH+6)+'" width="10" height="8" fill="#3A9A3A" rx="1"/>'
    +'<text x="'+(BPL+13)+'" y="'+(BH+14)+'" font-size="9" fill="#5AC45A" font-family="monospace">GANANCIA</text>'
    +'<rect x="'+(BPL+90)+'" y="'+(BH+6)+'" width="10" height="8" fill="#B85450" rx="1"/>'
    +'<text x="'+(BPL+103)+'" y="'+(BH+14)+'" font-size="9" fill="#F0A0A0" font-family="monospace">PERDIDA</text>'
    +'</svg>';


  // ═══ CHART 3: Donut this month ═══
  var d=cur(); var totalD=0;
  var slices=allCats.map(function(cat){
    var v=(d.gastos[cat.id]||[]).reduce(function(s,x){return s+x.importe;},0);
    totalD+=v; return{cat:cat,v:v};
  }).filter(function(s){return s.v>0;});

  var DW=340,DH=220,DR=78,CX=110,CY=110;
  var donutPaths='';
  if(totalD>0){
    var angle=-Math.PI/2;
    slices.forEach(function(s){
      var sweep=(s.v/totalD)*Math.PI*2;
      var ir=46;
      var x1=CX+DR*Math.cos(angle),   y1=CY+DR*Math.sin(angle);
      var x2=CX+DR*Math.cos(angle+sweep), y2=CY+DR*Math.sin(angle+sweep);
      var ix1=CX+ir*Math.cos(angle+sweep),iy1=CY+ir*Math.sin(angle+sweep);
      var ix2=CX+ir*Math.cos(angle),   iy2=CY+ir*Math.sin(angle);
      var large=sweep>Math.PI?1:0;
      donutPaths+='<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)
        +' A'+DR+' '+DR+' 0 '+large+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)
        +' L'+ix1.toFixed(1)+' '+iy1.toFixed(1)
        +' A'+ir+' '+ir+' 0 '+large+' 0 '+ix2.toFixed(1)+' '+iy2.toFixed(1)
        +' Z" fill="'+s.cat.color+'" stroke="#040410" stroke-width="2"/>';
      angle+=sweep;
    });
  }
  // Center
  donutPaths+='<text x="'+CX+'" y="'+(CY-8)+'" text-anchor="middle" font-size="9" fill="#555" font-family="monospace">TOTAL</text>';
  donutPaths+='<text x="'+CX+'" y="'+(CY+8)+'" text-anchor="middle" font-size="13" font-weight="bold" fill="#E8E0D0" font-family="Georgia,serif">'+fmt(totalD)+'</text>';

  // Right side legend with amounts
  var legR=slices.map(function(s,i){
    var ly=16+i*22;
    if(ly>DH-10)return '';
    var pct=Math.round(s.v/totalD*100);
    return '<rect x="225" y="'+ly+'" width="10" height="10" fill="'+s.cat.color+'" rx="1"/>'
      +'<text x="238" y="'+(ly+9)+'" font-size="9" fill="#888" font-family="monospace">'+s.cat.label.toUpperCase().slice(0,10)+'</text>'
      +'<text x="'+(DW-8)+'" y="'+(ly+9)+'" text-anchor="end" font-size="9" fill="'+s.cat.color+'" font-family="monospace">'+pct+'%</text>';
  }).join('');

  var svgDonut='<svg viewBox="0 0 '+DW+' '+DH+'" style="width:100%;display:block;">'
    +'<rect width="'+DW+'" height="'+DH+'" fill="#040410" rx="10"/>'
    +donutPaths+legR+'</svg>';

  return '<div class="card" style="margin-bottom:10px;"><div style="padding:14px 16px;">'
    +'<div class="lbl" style="color:#2A6AA0;margin-bottom:10px;">📈 EVOLUCIÓN MENSUAL · TOTAL POR MES</div>'
    +svgEvol+'</div></div>'
    +'<div class="card" style="margin-bottom:10px;"><div style="padding:14px 16px;">'
    +'<div class="lbl" style="color:#2A6AA0;margin-bottom:10px;">🧧 EVOLUCIÓN APUESTAS</div>'
    +svgPvM+'</div></div>'
    +'<div class="card"><div style="padding:14px 16px;">'
    +'<div class="lbl" style="color:#2A6AA0;margin-bottom:10px;">🥧 DISTRIBUCIÓN · '+MESES[parseInt(S.curKey.split("-")[1])-1].toUpperCase()+'</div>'
    +svgDonut+'</div></div>';
}

// ─── AHORRO Y ALERTAS ────────────────────────────────────────────────────────
function renderAhorro(){
  var d=cur();
  var meta=d.meta||{presupuesto:2000,bote:0};
  var t=totals();
  var gastado=t.total;
  var ahorro=meta.presupuesto-gastado;
  var pct=meta.presupuesto>0?Math.min(100,(gastado/meta.presupuesto)*100):0;
  var barColor=pct>90?"#B85450":pct>70?"#E8C87A":"#5AC45A";
  var boteTotal=Object.keys(S.months).reduce(function(s,k){return s+((S.months[k].meta&&S.months[k].meta.bote)||0);},0);
  var alertas=d.alertas||{};

  // Build alerts HTML
  var alertHTML="";
  cats().forEach(function(cat){
    var lim=alertas[cat.id]||0;
    var gast=(d.gastos[cat.id]||[]).reduce(function(s,x){return s+x.importe;},0);
    if(lim>0&&gast>=lim*0.8){
      var over=gast>=lim;
      alertHTML+='<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:'+(over?"#1A0808":"#1A1800")+';border-radius:8px;margin-bottom:6px;">'
        +'<span>'+(over?"🔴":"🟡")+'</span>'
        +'<span style="font-size:12px;color:'+(over?"#F0A0A0":"#E8C87A")+';">'+cat.emoji+' '+cat.label+': '+fmt(gast)+' / '+fmt(lim)+(over?' ⚠️ SUPERADO':'  (80%+)')+'</span>'
        +'</div>';
    }
  });

  var p=S.curKey.split("-");
  return '<div class="card" style="margin-bottom:10px;"><div style="padding:16px;">'
    +'<div class="lbl" style="color:#27AE60;margin-bottom:14px;">🏆 META · '+MESES[parseInt(p[1])-1].toUpperCase()+' '+p[0]+'</div>'
    +'<div style="display:flex;justify-content:space-between;margin-bottom:6px;">'
    +'<span style="font-size:11px;color:#666;">Gastado</span><span style="font-size:11px;color:#666;">Presupuesto</span></div>'
    +'<div style="background:#040410;border-radius:8px;height:14px;margin-bottom:8px;overflow:hidden;">'
    +'<div style="height:14px;border-radius:8px;background:'+barColor+';width:'+pct.toFixed(1)+'%;transition:width .5s;"></div></div>'
    +'<div style="display:flex;justify-content:space-between;margin-bottom:16px;">'
    +'<span style="font-size:18px;font-weight:bold;color:'+barColor+'">'+fmt(gastado)+'</span>'
    +'<span style="font-size:18px;font-weight:bold;color:#AAA">'+fmt(meta.presupuesto)+'</span></div>'
    +'<div style="background:#040410;border-radius:12px;padding:14px;text-align:center;margin-bottom:14px;">'
    +(ahorro>=0
      ?'<div style="font-size:10px;color:#27AE60;letter-spacing:2px;margin-bottom:4px;">🎉 AHORRO ESTE MES</div>'
       +'<div style="font-size:32px;font-weight:bold;color:#5AC45A;">+'+fmt(ahorro)+'</div>'
       +'<div style="font-size:11px;color:#444;margin-top:4px;">¡Bien hecho! Añádelo al bote 👇</div>'
      :'<div style="font-size:10px;color:#B85450;letter-spacing:2px;margin-bottom:4px;">⚠️ PRESUPUESTO SUPERADO</div>'
       +'<div style="font-size:32px;font-weight:bold;color:#F0A0A0;">'+fmt(ahorro)+'</div>'
    )+'</div>'
    +'<div style="display:flex;gap:8px;align-items:center;margin-bottom:0;">'
    +'<span style="font-size:12px;color:#666;flex:1;">PRESUPUESTO DEL MES (€)</span>'
    +'<input class="iline" type="number" value="'+meta.presupuesto+'" onchange="updateMeta(\'presupuesto\',this.value)" style="width:100px;">'
    +'</div></div></div>'
    // Bote inversión
    +'<div class="card" style="margin-bottom:10px;"><div style="padding:16px;background:#0A180A;border-radius:14px;">'
    +'<div class="lbl" style="color:#27AE60;margin-bottom:10px;">💰 BOTE DE INVERSIÓN</div>'
    +'<div style="font-size:32px;font-weight:bold;color:#5AC45A;margin-bottom:12px;">'+fmt(boteTotal)+'</div>'
    +'<div style="display:flex;gap:8px;">'
    +(ahorro>0?'<button onclick="addBote('+ahorro.toFixed(2)+')" style="flex:1;background:#1A3A1A;color:#5AC45A;border:1px solid #2A5A2A;border-radius:8px;padding:9px;font-size:12px;cursor:pointer;font-family:Georgia,serif;">+ Añadir ahorro mes ('+fmt(ahorro)+')</button>':'')
    +'<button onclick="addBoteManual()" style="flex:1;background:#0A0A1A;color:#666;border:1px solid #1E1E38;border-radius:8px;padding:9px;font-size:12px;cursor:pointer;font-family:Georgia,serif;">+ Manual</button>'
    +'</div></div></div>'
    // Alertas activas
    +(alertHTML?'<div class="card" style="margin-bottom:10px;"><div style="padding:14px 16px;">'
      +'<div class="lbl" style="color:#E8C87A;margin-bottom:10px;">🔔 ALERTAS ACTIVAS</div>'
      +alertHTML+'</div></div>':"")
    // Límites
    +'<div class="card"><div style="padding:14px 16px;">'
    +'<div class="lbl" style="color:#555;margin-bottom:10px;">⚙️ LÍMITES POR CATEGORÍA</div>'
    +'<div style="font-size:11px;color:#333;margin-bottom:12px;">ALERTA AL 80% Y AL 100% DEL LÍMITE. PON 0 PARA DESACTIVAR.</div>'
    +cats().map(function(cat){
      var lim=alertas[cat.id]||0;
      var gast=(d.gastos[cat.id]||[]).reduce(function(s,x){return s+x.importe;},0);
      var pctC=lim>0?Math.min(100,(gast/lim)*100):0;
      var bc=pctC>=100?"#B85450":pctC>=80?"#E8C87A":"#2A5A2A";
      return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #0A0A1A;">'
        +'<span style="font-size:15px;">'+cat.emoji+'</span>'
        +'<span style="font-size:12px;color:#888;flex:1;">'+cat.label.toUpperCase()+'</span>'
        +(lim>0?'<div style="width:50px;background:#040410;border-radius:4px;height:4px;overflow:hidden;"><div style="height:4px;background:'+bc+';width:'+pctC.toFixed(0)+'%;"></div></div>':'')
        +'<input class="iline" type="number" placeholder="0" value="'+(lim||"")+'" onchange="updateAlerta(\''+cat.id+'\',this.value)" style="width:80px;text-align:right;">'
        +'</div>';
    }).join("")
    +'</div></div>';
}

function updateMeta(key,val){var d=cur();if(!d.meta)d.meta={presupuesto:2000,bote:0};d.meta[key]=parseFloat(val)||0;saveData(d);}
function addBote(amount){var d=cur();if(!d.meta)d.meta={presupuesto:2000,bote:0};d.meta.bote=(d.meta.bote||0)+amount;saveData(d);}
function addBoteManual(){var v=prompt("¿Cuánto añades al bote de inversión?");if(!v)return;addBote(parseFloat(v.replace(",","."))||0);}
function updateAlerta(catId,val){var d=cur();if(!d.alertas)d.alertas={};d.alertas[catId]=parseFloat(val)||0;saveData(d);}

function saveGasEdit(id){
  var d=cur();
  d.gasolina=d.gasolina.map(function(g){
    if(g.id!==id)return g;
    return {id:g.id,fecha:S.editRow.fecha||g.fecha,precio:parseFloat(S.editRow.precio)||g.precio,
      euros:parseFloat(S.editRow.euros)||g.euros,litros:parseFloat(S.editRow.litros)||g.litros,
      kms:parseFloat(S.editRow.kms)||g.kms,km_total:parseFloat(S.editRow.km_total)||g.km_total};
  });
  S.editId=null;saveData(d);
}
function delGas(id){var d=cur();var del=d.gasolina.find(function(g){return g.id===id;});pushUndo(d,"Repostaje borrado: "+(del?del.fecha:""));d.gasolina=d.gasolina.filter(function(g){return g.id!==id;});saveData(d);}
function addGas(){
  var fecha=document.getElementById("ng-fecha").value;

function renderBancos(){
  var bk=cur().bankinter||[];var sb=cur().sabadell||[];
  function bankSection(title,color,items,which){
    var tot=items.reduce(function(s,x){return s+x.importe;},0);
    var paid=items.filter(function(x){return x.pagado;}).reduce(function(s,x){return s+x.importe;},0);
    var rows=items.map(function(item){
      return '<div class="chk-row" onclick="toggleChk(\''+which+'\',\''+item.id+'\')" style="display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid #141428;cursor:pointer;">'
        +'<div style="display:flex;align-items:center;gap:10px;">'
        +'<div style="width:22px;height:22px;border-radius:6px;border:2px solid #2A2A40;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;'+(item.pagado?"background:#1A3A1A;border-color:#3A6A3A;":"")+'">'+(item.pagado?"✓":"")+'</div>'
        +'<span style="font-size:13px;color:'+(item.pagado?"#555":"#C0B8A8")+';'+(item.pagado?"text-decoration:line-through;":"")+'">'+esc(item.label)+'</span>'
        +'</div>'
        +'<span style="font-size:13px;font-weight:bold;color:'+(item.pagado?"#555":color)+'">'+fmt(item.importe)+'</span>'
        +'</div>';
    }).join("");
    var pct=tot>0?Math.round((paid/tot)*100):0;
    return '<div class="card" style="margin-bottom:10px;">'
      +'<div class="card-hdr" style="background:'+color+'18;">'
      +'<div style="display:flex;align-items:center;gap:8px;"><span style="font-size:18px;">🏦</span>'
      +'<span style="font-size:14px;font-weight:bold;color:var(--text);">'+title+'</span></div>'
      +'<div style="text-align:right;">'
      +'<div style="font-size:13px;font-weight:bold;color:'+color+'">'+fmt(paid)+' / '+fmt(tot)+'</div>'
      +'<div style="font-size:10px;color:#444;">'+pct+'% cobrado</div>'
      +'</div></div>'
      +'<div style="height:3px;background:#070718;"><div style="height:3px;background:'+color+';width:'+pct+'%;transition:width .3s;"></div></div>'
      +rows
      +'<div style="padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #141428;">'
      +'<span style="font-size:12px;color:#555;">Pendiente</span>'
      +'<span style="font-size:14px;font-weight:bold;color:'+(paid<tot?"#F0A0A0":"#5AC45A")+'">'+fmt(tot-paid)+'</span>'
      +'</div></div>';
  }
  return bankSection("Bankinter","#1A7ABF",bk,"bankinter")
       + bankSection("Sabadell","#E8505B",sb,"sabadell");
}
function toggleChk(which,id){
  var d=cur();
  d[which]=d[which].map(function(x){return x.id===id?Object.assign({},x,{pagado:!x.pagado}):x;});
  saveData(d);
}

// ─── VOICE INPUT ─────────────────────────────────────────────────────────────
var voiceParsed = null;
var voiceTimer = null;

var CATS_VOICE = [
  {id:"ocio",      labels:["ocio","cerveza","cervezas","bar","restaurante","cena","taxi","copa","copas","cafe","café","vino","vermut","tapas","discoteca","concierto","cine","theater","teatro","futbol","entrada"]},
  {id:"coche",     labels:["coche","gasolina","gasofa","parking","aparcamiento","taller","aceite","ruedas","itv","multa","seguro coche","carburante"]},
  {id:"inversion", labels:["inversión","inversion","btc","bitcoin","bolsa","acción","accion","crypto","fondo","myinvestor","river","kronos","cartera"]},
  {id:"regalos",   labels:["regalo","regalos","cumpleaños","cumpleanos","presente","detalle"]},
  {id:"pelo",      labels:["pelo","peluquería","peluqueria","corte","barbería","barberia","laser","láser","depilación","depilacion"]},
  {id:"otros",     labels:["otros","otro","fisio","fisioterapia","médico","medico","farmacia","medicina","tablet","móvil","movil","ordenador","ropa","zapatillas","electrónica","electronica","libros","formación","formacion","gym","gimnasio"]}
];

function detectCat(text){
  var t = text.toLowerCase();
  var custom = S.customCats||[];
  for(var k=0;k<custom.length;k++){
    if(t.indexOf(custom[k].label.toLowerCase())>=0) return custom[k].id;
  }
  for(var i=0;i<CATS_VOICE.length;i++){
    for(var j=0;j<CATS_VOICE[i].labels.length;j++){
      if(t.indexOf(CATS_VOICE[i].labels[j])>=0) return CATS_VOICE[i].id;
    }
  }
  return "otros";
}

function parseVoiceLocal(text){
  var amtMatch = text.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:euros?|€)?/i);
  var amount = amtMatch ? parseFloat(amtMatch[1].replace(',','.')) : 0;
  var concept = text
    .replace(/\d+(?:[.,]\d{1,2})?\s*(?:euros?|€)?/gi,'')
    .replace(/(añadir|gasto|en|de|por|el|la|los|las|un|una|euros?)/gi,'')
    .trim().replace(/\s+/g,' ').trim();
  if(concept) concept = concept.charAt(0).toUpperCase() + concept.slice(1).toLowerCase();
  var catId = detectCat(text);
  var catObj = CATS_BASE.concat(S.customCats||[]).find(function(c){return c.id===catId;});
  return {catId:catId, catLabel:catObj?catObj.label:catId, concept:concept||text, amount:amount};
}

function startVoice(){
  voiceParsed = null;
  document.getElementById("voice-modal").classList.add("show");
  document.getElementById("voice-result").classList.remove("show");
  document.getElementById("va-save").style.display = "none";
  document.getElementById("va-process").style.display = "inline-block";
  var inp = document.getElementById("voice-input");
  inp.value = "";
  setTimeout(function(){ inp.focus(); }, 300);
}

function closeVoice(){
  document.getElementById("voice-modal").classList.remove("show");
  voiceParsed = null;
}

function onVoiceInput(val){
  if(voiceTimer) clearTimeout(voiceTimer);
  if(val.trim().length > 3){
    voiceTimer = setTimeout(function(){ processVoiceText(val); }, 1200);
  }
}

function processVoiceText(text){
  if(!text || !text.trim()) return;
  if(voiceTimer) clearTimeout(voiceTimer);

  // Try Claude API first
  fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 150,
      system: "Extrae gastos. Responde SOLO JSON sin texto extra: {catId,concept,amount}. Categorias: ocio,coche,inversion,regalos,pelo,otros",
      messages: [{role:"user", content: "Gasto: " + text}]
    })
  })
  .then(function(r){return r.json();})
  .then(function(data){
    try{
      var txt = data.content && data.content[0] && data.content[0].text || "";
      var clean = txt.replace(/```[a-z]*|```/g,"").trim();
      var parsed = JSON.parse(clean);
      if(parsed.catId && parsed.amount > 0){
        var catObj = CATS_BASE.concat(S.customCats||[]).find(function(c){return c.id===parsed.catId;});
        voiceParsed = {catId:parsed.catId, catLabel:catObj?catObj.label:parsed.catId, concept:parsed.concept||text, amount:parsed.amount};
        showVoiceResult(voiceParsed);
        return;
      }
    }catch(e){}
    voiceParsed = parseVoiceLocal(text);
    showVoiceResult(voiceParsed);
  })
  .catch(function(){
    voiceParsed = parseVoiceLocal(text);
    showVoiceResult(voiceParsed);
  });
}

function showVoiceResult(p){
  var catObj = CATS_BASE.concat(S.customCats||[]).find(function(c){return c.id===p.catId;});
  document.getElementById("vr-cat").textContent = (catObj?catObj.emoji+" ":"")+p.catLabel.toUpperCase();
  document.getElementById("vr-concepto").textContent = p.concept;
  document.getElementById("vr-importe").textContent = fmt(p.amount);
  document.getElementById("voice-result").classList.add("show");
  document.getElementById("va-save").style.display = "inline-block";
  document.getElementById("va-process").style.display = "none";
}

function saveVoiceGasto(){
  if(!voiceParsed || !voiceParsed.amount) return;
  // Save refs BEFORE closeVoice nulls voiceParsed
  var catId = voiceParsed.catId;
  var concept = voiceParsed.concept;
  var amount = voiceParsed.amount;
  var d = cur();
  if(!d.gastos[catId]) d.gastos[catId] = [];
  d.gastos[catId].push({id:uid(), concepto:concept, importe:amount, nota:""});
  saveData(d);
  closeVoice();
  // Toast confirmation
  var toast = document.createElement("div");
  toast.style.cssText = "position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--navy2);border:1px solid var(--green);border-radius:14px;padding:12px 22px;color:var(--green);font-size:13px;z-index:999;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.5);font-weight:600;letter-spacing:.3px;";
  toast.textContent = "✓ "+concept+" — "+fmt(amount)+" guardado";
  document.body.appendChild(toast);
  setTimeout(function(){
    toast.style.opacity="0";toast.style.transition="opacity .3s";
    setTimeout(function(){toast.remove();},300);
  },2500);
}

// ─── ICON ──────────────────────────────────────────────────────────────────
(function(){
  var cv=document.createElement("canvas");cv.width=180;cv.height=180;
  var ctx=cv.getContext("2d");
  // Background: deep graphite with subtle blue glow top
  var bg=ctx.createLinearGradient(0,0,0,180);
  bg.addColorStop(0,"#0D1022");bg.addColorStop(1,"#07080D");
  ctx.fillStyle=bg;ctx.fillRect(0,0,180,180);
  // Blue radial glow top-center
  var glow=ctx.createRadialGradient(90,30,5,90,30,100);
  glow.addColorStop(0,"rgba(79,142,247,0.22)");glow.addColorStop(1,"rgba(79,142,247,0)");
  ctx.fillStyle=glow;ctx.fillRect(0,0,180,180);
  // Thin gold outer border
  ctx.strokeStyle="#D4A830";ctx.lineWidth=3.5;
  ctx.strokeRect(3,3,174,174);
  // Corner accents (gold)
  var corner=12;ctx.strokeStyle="#D4A830";ctx.lineWidth=2.5;
  [[3,3],[177,3],[3,177],[177,177]].forEach(function(pt,i){
    ctx.beginPath();
    var dx=i%2===0?corner:-corner;var dy=i<2?corner:-corner;
    ctx.moveTo(pt[0]+dx,pt[1]);ctx.lineTo(pt[0],pt[1]);ctx.lineTo(pt[0],pt[1]+dy);
    ctx.stroke();
  });
  // P — large, white, centered
  ctx.fillStyle="#F8FAFC";ctx.font="700 96px -apple-system,'SF Pro Display',sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("P",90,96);
  // Blue dot accent — top right
  ctx.fillStyle="#4F8EF7";ctx.beginPath();ctx.arc(148,32,8,0,Math.PI*2);ctx.fill();
  // Small gold line under P
  ctx.fillStyle="#D4A830";ctx.fillRect(62,138,56,2);
  var url=cv.toDataURL("image/png");
  var l=document.createElement("link");l.rel="apple-touch-icon";l.href=url;document.head.appendChild(l);
  var f2=document.createElement("link");f2.rel="icon";f2.href=url;document.head.appendChild(f2);
})();
</script>
